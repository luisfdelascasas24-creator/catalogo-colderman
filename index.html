<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Colderman</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF6A1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colderman">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #16181D;
  --ink-soft: #767C87;
  --bg: #FAFAFA;
  --accent: #FF6A1A;
  --accent-deep: #E85700;
  --line: #ECECEC;
  --ok: #1B8A5A;
  --bad: #D8483A;
  --card: #FFFFFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
.app { max-width: 480px; margin: 0 auto; background: var(--bg); min-height: 100vh; }

.topbar {
  background: var(--card);
  padding: 18px 18px 12px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 20;
}
.topbar-title {
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -0.01em;
}
.back-btn {
  color: var(--accent);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
}

.search-wrap { padding: 14px 16px 10px; background: var(--bg); }
.search-wrap input {
  width: 100%;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }

.cats-wrap {
  display: flex;
  gap: 7px;
  padding: 2px 16px 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.cats-wrap::-webkit-scrollbar { display: none; }
.cat {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  padding: 7px 15px;
  border-radius: 100px;
  white-space: nowrap;
  cursor: pointer;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
}
.cat.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.count-badge {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  color: var(--ink-soft);
  padding: 2px 16px 10px;
}

.product-list { padding: 0 12px 20px; display: flex; flex-direction: column; gap: 10px; }
.product-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px;
  display: flex;
  gap: 12px;
  align-items: center;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(22,24,29,0.04);
}
.product-card:active { background: #F6F6F6; }
.product-thumb { width: 60px; height: 60px; border-radius: 12px; background: var(--bg); object-fit: cover; flex-shrink: 0; }
.product-thumb-placeholder {
  width: 60px; height: 60px; border-radius: 12px; background: var(--bg);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  color: #C7CBD1; font-size: 22px;
}
.product-info { flex: 1; min-width: 0; }
.product-code {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.product-name {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.product-stock { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600; color: var(--ok); margin-top: 4px; }
.arrow { color: #C7CBD1; font-size: 18px; }

.detail-view { display: none; }
.detail-view.active { display: block; }

@keyframes viewEnter {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.home-view:not(.hidden), .list-view:not(.hidden), .detail-view.active {
  animation: viewEnter 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}
.product-card, .cat-tile {
  transition: transform 0.12s ease, background-color 0.12s ease;
}
.product-card:active, .cat-tile:active {
  transform: scale(0.97);
}
.btn-wsp, .btn-copy {
  transition: transform 0.12s ease;
}
.btn-wsp:active:not(:disabled), .btn-copy:active {
  transform: scale(0.98);
}
.hidden { display: none !important; }

.cat-tiles {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 6px 16px 20px;
}
.cat-tile {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(22,24,29,0.04);
}
.cat-tile:active { background: #F6F6F6; }
.cat-tile-icon { font-size: 26px; margin-bottom: 4px; }
.cat-tile-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 15.5px;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.cat-tile-count {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--ink-soft);
}

.photos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 14px; background: #F1F1EF; }
.photo-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1; cursor: pointer; border: 3px solid transparent; transition: border-color 0.15s, transform 0.12s ease; background: #fff; }
.photo-item:active { transform: scale(0.96); }
.photo-item.selected { border-color: var(--accent); }
.photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-check {
  position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 100px;
  background: var(--accent); display: none; align-items: center; justify-content: center;
  color: white; font-size: 12px;
}
.photo-item.selected .photo-check { display: flex; }

.detail-body { padding: 18px; }
.detail-code-tag {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 24px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.01em;
  margin-bottom: 4px;
}
.detail-name {
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  color: var(--ink-soft);
  line-height: 1.3;
}
.specs-title {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-soft);
  margin: 20px 0 4px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}
.spec-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.spec-label { font-family: 'Inter', sans-serif; color: var(--ink-soft); }
.spec-val { font-family: 'Inter', sans-serif; color: var(--ink); font-weight: 600; }

.actions { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.btn-copy {
  width: 100%; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); font-family: 'Inter', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-copy:active { background: #F6F6F6; }
.btn-wsp {
  width: 100%; padding: 15px; border-radius: 12px; border: none; background: #25D366;
  color: white; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-wsp:disabled { background: #D8DAD6; }
.btn-wsp:active { background: #1da851; }
.select-hint { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--ink-soft); text-align: center; }
.copied-msg { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ok); text-align: center; font-weight: 600; display: none; }
.empty { padding: 3rem; text-align: center; color: var(--ink-soft); font-family: 'Inter', sans-serif; font-size: 14px; }
.loading { padding: 3rem; text-align: center; color: var(--ink-soft); font-family: 'Inter', sans-serif; font-size: 14px; }
</style>
</head>
<body>

<div class="app">
  <div class="home-view" id="homeView">
    <div class="topbar">
      <button class="back-btn hidden" id="homeBackBtn" onclick="clearHomeSearch()">‹ Volver</button>
      <span class="topbar-title">Catálogo Colderman</span>
    </div>
    <div class="search-wrap">
      <input type="text" id="homeSearchInput" placeholder="Buscar por código, producto o marca..." oninput="debounceSearch()" />
    </div>
    <div id="catTiles" class="cat-tiles"></div>
    <div id="homeCount" class="count-badge hidden"></div>
    <div id="homeResults" class="product-list hidden"></div>
  </div>

  <div class="list-view hidden" id="listView">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">‹ Volver</button>
      <span class="topbar-title" id="listTitle">Resultados</span>
    </div>
    <div id="productCount" class="count-badge"></div>
    <div id="productList" class="product-list"></div>
  </div>

  <div class="detail-view" id="detailView">
    <div class="topbar">
      <button class="back-btn" onclick="goBack()">‹ Volver</button>
      <span class="topbar-title" id="detailTitle"></span>
    </div>
    <div class="photos-grid" id="photosGrid"></div>
    <div class="detail-body">
      <p class="detail-code-tag" id="dCodigo"></p>
      <p class="detail-name" id="dNombre"></p>
      <p class="specs-title">Especificaciones</p>
      <div id="specsContainer"></div>
    </div>
    <div class="actions">
      <button class="btn-copy" onclick="copyText()">
        📋 Copiar datos del producto
      </button>
      <div class="copied-msg" id="copiedMsg">✓ Datos copiados al portapapeles</div>
      <button class="btn-wsp" id="wspBtn" onclick="shareEverything()" disabled>
        💬 Enviar por WhatsApp
      </button>
      <p class="select-hint" id="selectHint">Selecciona las fotos que quieres enviar</p>
    </div>
  </div>
</div>

<script>
const SHEET_ID = '1pXIUcd2WNbr29ZWkxOdISj--yTB64vPAxQyfVjOLoQ0';
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1`;

// Orden de prioridad: lo que más se vende primero. Cualquier categoría que
// no esté en esta lista aparece después, ordenada alfabéticamente.
const ORDEN_PRIORIDAD = ['Compresores', 'Evaporadores', 'Condensadores', 'Herramientas', 'Filtros', 'Blowers'];
const ICONOS_CATEGORIA = {
  'Compresores': '⚙️', 'Evaporadores': '❄️', 'Condensadores': '🌬️',
  'Herramientas': '🛠️', 'Filtros': '🧰', 'Blowers': '🌀', 'Bobinas': '🧲',
  'Válvulas': '🔩', 'Mangueras / Fittings': '🔗', 'Fittings': '🔗',
  'Gases / Aceites': '🧴', 'Gases': '🧪', 'Aceites': '🛢️',
  'Switch / Sensores': '📟', 'Electroventiladores': '🌪️',
  'Equipos Eléctricos': '🔌', 'Presostatos': '🎚️', 'Termostatos': '🌡️',
  'Ferrules': '🔗', 'Poleas': '⭕', 'Tapas': '🔘', 'Otros': '📦'
};

let allProducts = [];
let currentProduct = null;
let selectedPhotos = [];
let activeCat = '';
let previousView = 'list'; // 'list' o 'home' — recuerda a dónde volver desde el detalle
let savedScrollY = 0;

function nombreMostrar(p) {
  const base = `${p['Producto'] || ''} ${p['Item'] || ''}`.trim();
  return base || p['NombreWeb'] || '(Sin nombre)';
}
let cameFromSearch = false;

async function loadProducts() {
  try {
    const res = await fetch(URL);
    const text = await res.text();
    const json = JSON.parse(text.substring(47).slice(0, -2));
    const rows = json.table.rows;
    const colNames = ['Codigo','Producto','Item','Marca','Modelo','Ranuras Polea','Voltaje','Refrigerante','Foto1','Foto2','Foto3','Foto4','Costo','Stock','Categoria','NombreWeb','Ancho','Alto','Grosor','SpecsExtra'];
    allProducts = rows.map(row => {
      const obj = {};
      colNames.forEach((col, i) => {
        obj[col] = row.c[i] ? (String(row.c[i].v) || '') : '';
      });
      return obj;
    }).filter(p => p['Codigo']);
    renderTiles();
  } catch(e) {
    document.getElementById('catTiles').innerHTML = '<div class="empty">Error cargando productos.</div>';
  }
}

function renderTiles() {
  const conteo = {};
  allProducts.forEach(p => {
    const cat = p['Categoria'] || 'Otros';
    conteo[cat] = (conteo[cat] || 0) + 1;
  });
  const categoriasConProductos = Object.keys(conteo);
  const prioritarias = ORDEN_PRIORIDAD.filter(c => categoriasConProductos.includes(c));
  const resto = categoriasConProductos.filter(c => !ORDEN_PRIORIDAD.includes(c)).sort();
  const ordenFinal = [...prioritarias, ...resto];

  const wrap = document.getElementById('catTiles');
  wrap.innerHTML = ordenFinal.map(cat => `
    <div class="cat-tile" onclick="openCategory('${cat.replace(/'/g, "\\'")}')">
      <span class="cat-tile-icon">${ICONOS_CATEGORIA[cat] || '📦'}</span>
      <span class="cat-tile-name">${cat}</span>
      <span class="cat-tile-count">${conteo[cat]} productos</span>
    </div>
  `).join('');
}

function openCategory(cat) {
  activeCat = cat;
  previousView = 'list';
  cameFromSearch = false;
  document.getElementById('homeView').classList.add('hidden');
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('listTitle').textContent = cat;
  renderList(allProducts.filter(p => (p['Categoria'] || 'Otros') === cat));
}

let searchTimer = null;
function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchFromHome, 220);
}

function searchFromHome() {
  const q = document.getElementById('homeSearchInput').value.trim();
  const tiles = document.getElementById('catTiles');
  const results = document.getElementById('homeResults');
  const count = document.getElementById('homeCount');
  const backBtn = document.getElementById('homeBackBtn');

  if (!q) {
    tiles.classList.remove('hidden');
    results.classList.add('hidden');
    count.classList.add('hidden');
    backBtn.classList.add('hidden');
    return;
  }

  const qLower = q.toLowerCase();
  const filtrados = allProducts.filter(p => Object.values(p).some(v => String(v).toLowerCase().includes(qLower)));

  tiles.classList.add('hidden');
  results.classList.remove('hidden');
  count.classList.remove('hidden');
  backBtn.classList.remove('hidden');
  count.textContent = `${filtrados.length} productos`;
  previousView = 'home';
  renderList(filtrados, 'homeResults');
}

function clearHomeSearch() {
  document.getElementById('homeSearchInput').value = '';
  searchFromHome();
}

function goHome() {
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('homeView').classList.remove('hidden');
  document.getElementById('homeSearchInput').value = '';
  searchFromHome();
}

function renderList(products, targetId) {
  targetId = targetId || 'productList';
  const list = document.getElementById(targetId);
  if (targetId === 'productList') {
    document.getElementById('productCount').textContent = `${products.length} productos`;
  }
  if (products.length === 0) {
    list.innerHTML = '<div class="empty">No se encontraron productos</div>';
    return;
  }
  list.innerHTML = products.map((p) => {
    const foto = p['Foto1'] || '';
    const thumb = foto
      ? `<img class="product-thumb" src="${foto}" onerror="this.style.display='none'" />`
      : `<div class="product-thumb-placeholder">📦</div>`;
    const stock = p['Stock'] && p['Stock'] !== '0' && p['Stock'] !== 'null'
      ? `<p class="product-stock">Stock: ${p['Stock']}</p>` : '';
    return `<div class="product-card" onclick="showDetail(${allProducts.indexOf(p)})">
      ${thumb}
      <div class="product-info">
        <p class="product-code">${p['Codigo'] || ''}</p>
        <p class="product-name">${nombreMostrar(p)} · ${p['Marca'] || ''} ${p['Modelo'] || ''}</p>
        ${stock}
      </div>
      <span class="arrow">›</span>
    </div>`;
  }).join('');
}

function showDetail(idx) {
  savedScrollY = window.scrollY;
  currentProduct = allProducts[idx];
  selectedPhotos = [];
  document.getElementById('homeView').classList.add('hidden');
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.add('active');
  document.getElementById('detailTitle').textContent = currentProduct['Codigo'] || '';
  document.getElementById('dNombre').textContent = nombreMostrar(currentProduct);
  document.getElementById('dCodigo').textContent = currentProduct['Codigo'] || '';

  const specs = ['Marca','Modelo','Ranuras Polea','Voltaje','Refrigerante','Ancho','Alto','Grosor'];
  let specsHtml = specs
    .filter(k => currentProduct[k] && currentProduct[k] !== 'null')
    .map(k => `<div class="spec-row"><span class="spec-label">${k}</span><span class="spec-val">${currentProduct[k]}</span></div>`)
    .join('');

  // Cualquier otra característica que traiga la ficha técnica de la web
  // (varía según el tipo de producto: medidas, compatibilidad, etc.)
  try {
    const extra = JSON.parse(currentProduct['SpecsExtra'] || '{}');
    Object.keys(extra).forEach(label => {
      const valor = extra[label];
      if (!valor) return;
      const labelBonito = label.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
      specsHtml += `<div class="spec-row"><span class="spec-label">${labelBonito}</span><span class="spec-val">${valor}</span></div>`;
    });
  } catch(e) {}

  if (currentProduct['Costo'] && currentProduct['Costo'] !== '0' && currentProduct['Costo'] !== 'null') {
    specsHtml += `<div class="spec-row"><span class="spec-label">Costo</span><span class="spec-val" style="color:#16324A;">$${Number(currentProduct['Costo']).toLocaleString('es-CL')}</span></div>`;
  }
  if (currentProduct['Stock'] !== undefined && currentProduct['Stock'] !== '' && currentProduct['Stock'] !== 'null') {
    const stock = Number(currentProduct['Stock']);
    const stockColor = stock > 0 ? '#3E7A4D' : '#B94A3D';
    const stockText = stock > 0 ? `${stock} disponibles` : 'Sin stock';
    specsHtml += `<div class="spec-row"><span class="spec-label">Stock</span><span class="spec-val" style="color:${stockColor};">${stockText}</span></div>`;
  }
  document.getElementById('specsContainer').innerHTML = specsHtml;

  const fotos = ['Foto1','Foto2','Foto3','Foto4'].filter(k => currentProduct[k] && currentProduct[k] !== 'null');
  const grid = document.getElementById('photosGrid');
  if (fotos.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;padding:1rem;text-align:center;color:#B7BBC0;font-size:13px;">Sin fotos cargadas</div>';
  } else {
    grid.innerHTML = fotos.map((k, i) => `
      <div class="photo-item" id="photo-${i}" onclick="togglePhoto(${i}, '${currentProduct[k]}')">
        <img src="${currentProduct[k]}" onerror="this.parentElement.style.display='none'" />
        <div class="photo-check">✓</div>
      </div>`).join('');
  }
  updateWspBtn();
}

function togglePhoto(idx, url) {
  const el = document.getElementById(`photo-${idx}`);
  const i = selectedPhotos.indexOf(url);
  if (i === -1) { selectedPhotos.push(url); el.classList.add('selected'); }
  else { selectedPhotos.splice(i, 1); el.classList.remove('selected'); }
  updateWspBtn();
}

function updateWspBtn() {
  const btn = document.getElementById('wspBtn');
  const hint = document.getElementById('selectHint');
  if (selectedPhotos.length === 0) {
    btn.disabled = true;
    hint.textContent = 'Selecciona las fotos que quieres enviar';
  } else {
    btn.disabled = false;
    hint.textContent = `${selectedPhotos.length} foto(s) seleccionada(s)`;
  }
}

function copyText() {
  const p = currentProduct;
  const text = `*${nombreMostrar(p)}*\nCódigo: ${p['Codigo'] || ''}\nMarca: ${p['Marca'] || ''}\nModelo: ${p['Modelo'] || ''}\nRanuras Polea: ${p['Ranuras Polea'] || ''}\nVoltaje: ${p['Voltaje'] || ''}\nRefrigerante: ${p['Refrigerante'] || ''}`;
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2500);
  });
}

async function shareEverything() {
  const p = currentProduct;
  const btn = document.getElementById('wspBtn');
  const text = `*${nombreMostrar(p)}*\nCódigo: ${p['Codigo'] || ''}\nMarca: ${p['Marca'] || ''}\nModelo: ${p['Modelo'] || ''}\nVoltaje: ${p['Voltaje'] || ''}\nRefrigerante: ${p['Refrigerante'] || ''}`;

  try {
    btn.textContent = '⏳ Procesando...';
    btn.disabled = true;

    await navigator.clipboard.writeText(text);

    const filePromises = selectedPhotos.map(async (url, i) => {
      const finalUrl = `https://images.weserv.nl/?url=${encodeURIComponent(url)}&output=jpg&q=70`;
      const res = await fetch(finalUrl);
      const blob = await res.blob();
      return new File([blob], `producto_${i+1}.jpg`, { type: 'image/jpeg' });
    });

    const files = await Promise.all(filePromises);

    if (navigator.share && navigator.canShare({ files })) {
      await navigator.share({ files, text, title: nombreMostrar(p) });
      const msg = document.getElementById('copiedMsg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 3000);
    } else {
      throw new Error("No compatible");
    }
  } catch(e) {
    const links = `\n\nFotos:\n${selectedPhotos.join('\n')}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text + links)}`, '_blank');
  } finally {
    btn.textContent = '💬 Enviar por WhatsApp';
    btn.disabled = false;
  }
}

function goBack() {
  if (previousView === 'home') {
    document.getElementById('homeView').classList.remove('hidden');
  } else {
    document.getElementById('listView').classList.remove('hidden');
  }
  document.getElementById('detailView').classList.remove('active');
  currentProduct = null;
  selectedPhotos = [];
  setTimeout(() => window.scrollTo(0, savedScrollY), 0);
}

loadProducts();

// Registro del service worker: habilita que el navegador ofrezca
// "Instalar app" / "Agregar a pantalla de inicio".
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
