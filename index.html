<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Colderman</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16324A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colderman">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1C232B;
  --ink-soft: #5B6470;
  --paper: #EDEEEA;
  --steel: #16324A;
  --steel-deep: #0E2436;
  --orange: #E1670E;
  --orange-deep: #B85207;
  --line: #DAD9D2;
  --ok: #3E7A4D;
  --bad: #B94A3D;
  --card: #FFFFFF;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
}
.app { max-width: 480px; margin: 0 auto; background: var(--paper); min-height: 100vh; }

.topbar {
  background: var(--steel);
  padding: 16px 16px 14px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  border-bottom: 3px solid var(--orange);
}
.topbar-title {
  color: #EAF1F6;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  font-size: 21px;
  letter-spacing: 0.01em;
}
.back-btn {
  color: #9FC1D6;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
}

.search-wrap { padding: 12px 14px 10px; background: var(--paper); }
.search-wrap input {
  width: 100%;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 10px 14px;
  border-radius: 6px;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  outline: none;
}
.search-wrap input:focus { border-color: var(--steel); }

.cats-wrap {
  display: flex;
  gap: 6px;
  padding: 2px 14px 12px;
  overflow-x: auto;
  scrollbar-width: none;
}
.cats-wrap::-webkit-scrollbar { display: none; }
.cat {
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 13px;
  border-radius: 5px;
  white-space: nowrap;
  cursor: pointer;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
}
.cat.active { background: var(--orange); color: #fff; border-color: var(--orange-deep); }

.count-badge {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--ink-soft);
  padding: 2px 14px 8px;
}

.product-list { padding: 0 10px 16px; display: flex; flex-direction: column; gap: 6px; }
.product-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px 10px;
  display: flex;
  gap: 10px;
  align-items: center;
  cursor: pointer;
}
.product-card:active { background: #F5F4F0; }
.product-thumb { width: 54px; height: 54px; border-radius: 4px; background: var(--paper); object-fit: cover; flex-shrink: 0; border: 1px solid var(--line); }
.product-thumb-placeholder {
  width: 54px; height: 54px; border-radius: 4px; background: var(--paper);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  color: #B7BBC0; font-size: 20px; border: 1px solid var(--line);
}
.product-info { flex: 1; min-width: 0; }
.product-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.15;
}
.product-code {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 4px;
}
.product-stock { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; color: var(--ok); margin-top: 3px; }
.arrow { color: #B7BBC0; font-size: 18px; }

.detail-view { display: none; }
.detail-view.active { display: block; }
.list-view.hidden { display: none; }

.photos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 12px; background: var(--steel-deep); }
.photo-item { position: relative; border-radius: 5px; overflow: hidden; aspect-ratio: 1; cursor: pointer; border: 3px solid transparent; transition: border-color 0.15s; }
.photo-item.selected { border-color: var(--orange); }
.photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-check {
  position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 4px;
  background: var(--orange); display: none; align-items: center; justify-content: center;
  color: white; font-size: 12px;
}
.photo-item.selected .photo-check { display: flex; }

.detail-body { padding: 16px; }
.detail-code-tag {
  display: inline-block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  background: var(--ink);
  padding: 3px 9px;
  border-radius: 4px;
  margin-bottom: 10px;
}
.detail-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 23px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.15;
}
.specs-title {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
  margin: 18px 0 6px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.spec-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.spec-label { font-family: 'Inter', sans-serif; color: var(--ink-soft); }
.spec-val { font-family: 'Inter', sans-serif; color: var(--ink); font-weight: 600; }

.actions { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.btn-copy {
  width: 100%; padding: 11px; border-radius: 6px; border: 1.5px solid var(--steel);
  background: var(--card); color: var(--steel); font-family: 'Inter', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-copy:active { background: #EDF2F5; }
.btn-wsp {
  width: 100%; padding: 14px; border-radius: 6px; border: none; background: #25D366;
  color: white; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-wsp:disabled { background: #C7CCC9; }
.btn-wsp:active { background: #1da851; }
.select-hint { font-family: 'Inter', sans-serif; font-size: 12px; color: var(--ink-soft); text-align: center; }
.copied-msg { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ok); text-align: center; font-weight: 600; display: none; }
.empty { padding: 3rem; text-align: center; color: var(--ink-soft); font-family: 'Inter', sans-serif; font-size: 14px; }
.loading { padding: 3rem; text-align: center; color: var(--ink-soft); font-family: 'Inter', sans-serif; font-size: 14px; }
</style>
</head>
<body>

<div class="app">
  <div class="list-view" id="listView">
    <div class="topbar">
      <span class="topbar-title">Catálogo Colderman</span>
    </div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Buscar por código, producto o marca..." oninput="filterProducts()" />
    </div>
    <div class="cats-wrap" id="catsWrap">
      <button class="cat active" onclick="filterCat(this, '')">Todos</button>
    </div>
    <div id="productCount" class="count-badge"></div>
    <div id="productList" class="product-list">
      <div class="loading">Cargando productos...</div>
    </div>
  </div>

  <div class="detail-view" id="detailView">
    <div class="topbar">
      <button class="back-btn" onclick="goBack()">‹ Volver</button>
      <span class="topbar-title" id="detailTitle"></span>
    </div>
    <div class="photos-grid" id="photosGrid"></div>
    <div class="detail-body">
      <p class="detail-code-tag" id="dCodigo"></p>
      <p class="detail-name" id="dNombre"></p>
      <p class="specs-title">Especificaciones</p>
      <div id="specsContainer"></div>
    </div>
    <div class="actions">
      <button class="btn-copy" onclick="copyText()">
        📋 Copiar datos del producto
      </button>
      <div class="copied-msg" id="copiedMsg">✓ Datos copiados al portapapeles</div>
      <button class="btn-wsp" id="wspBtn" onclick="shareEverything()" disabled>
        💬 Enviar por WhatsApp
      </button>
      <p class="select-hint" id="selectHint">Selecciona las fotos que quieres enviar</p>
    </div>
  </div>
</div>

<script>
const SHEET_ID = '1pXIUcd2WNbr29ZWkxOdISj--yTB64vPAxQyfVjOLoQ0';
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1`;

let allProducts = [];
let currentProduct = null;
let selectedPhotos = [];
let activeCat = '';

async function loadProducts() {
  try {
    const res = await fetch(URL);
    const text = await res.text();
    const json = JSON.parse(text.substring(47).slice(0, -2));
    const rows = json.table.rows;
    const colNames = ['Codigo','Producto','Item','Marca','Modelo','Ranuras Polea','Voltaje','Refrigerante','Foto1','Foto2','Foto3','Foto4','Costo','Stock','Categoria'];
    allProducts = rows.map(row => {
      const obj = {};
      colNames.forEach((col, i) => {
        obj[col] = row.c[i] ? (String(row.c[i].v) || '') : '';
      });
      return obj;
    }).filter(p => p['Codigo'] || p['Producto']);
    renderCats(allProducts);
    renderList(allProducts);
  } catch(e) {
    document.getElementById('productList').innerHTML = '<div class="empty">Error cargando productos.</div>';
  }
}

function renderList(products) {
  const list = document.getElementById('productList');
  const count = document.getElementById('productCount');
  count.textContent = `${products.length} productos`;
  if (products.length === 0) {
    list.innerHTML = '<div class="empty">No se encontraron productos</div>';
    return;
  }
  list.innerHTML = products.map((p) => {
    const foto = p['Foto1'] || '';
    const thumb = foto
      ? `<img class="product-thumb" src="${foto}" onerror="this.style.display='none'" />`
      : `<div class="product-thumb-placeholder">📦</div>`;
    const stock = p['Stock'] && p['Stock'] !== '0' && p['Stock'] !== 'null'
      ? `<p class="product-stock">Stock: ${p['Stock']}</p>` : '';
    return `<div class="product-card" onclick="showDetail(${allProducts.indexOf(p)})">
      ${thumb}
      <div class="product-info">
        <p class="product-name">${p['Producto'] || ''} ${p['Item'] || ''}</p>
        <p class="product-code">${p['Codigo'] || ''} · ${p['Marca'] || ''} ${p['Modelo'] || ''}</p>
        ${stock}
      </div>
      <span class="arrow">›</span>
    </div>`;
  }).join('');
}

function renderCats(products) {
  const cats = [...new Set(products.map(p => p['Categoria'] || p['Producto']).filter(Boolean))].sort();
  const wrap = document.getElementById('catsWrap');
  wrap.innerHTML = `<button class="cat ${activeCat === '' ? 'active' : ''}" onclick="filterCat(this, '')">Todos</button>` +
    cats.map(c => `<button class="cat ${activeCat === c ? 'active' : ''}" onclick="filterCat(this, '${c}')">${c}</button>`).join('');
}

function filterCat(btn, cat) {
  activeCat = cat;
  document.querySelectorAll('.cat').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterProducts();
}

function filterProducts() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = allProducts.filter(p =>
    Object.values(p).some(v => String(v).toLowerCase().includes(q))
  );
  if (activeCat) filtered = filtered.filter(p => (p['Categoria'] || p['Producto']) === activeCat);
  renderList(filtered);
}

function showDetail(idx) {
  currentProduct = allProducts[idx];
  selectedPhotos = [];
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.add('active');
  document.getElementById('detailTitle').textContent = currentProduct['Codigo'] || '';
  document.getElementById('dNombre').textContent = `${currentProduct['Producto'] || ''} ${currentProduct['Item'] || ''}`;
  document.getElementById('dCodigo').textContent = currentProduct['Codigo'] || '';

  const specs = ['Marca','Modelo','Ranuras Polea','Voltaje','Refrigerante'];
  let specsHtml = specs
    .filter(k => currentProduct[k] && currentProduct[k] !== 'null')
    .map(k => `<div class="spec-row"><span class="spec-label">${k}</span><span class="spec-val">${currentProduct[k]}</span></div>`)
    .join('');

  if (currentProduct['Costo'] && currentProduct['Costo'] !== '0' && currentProduct['Costo'] !== 'null') {
    specsHtml += `<div class="spec-row"><span class="spec-label">Costo</span><span class="spec-val" style="color:#16324A;">$${Number(currentProduct['Costo']).toLocaleString('es-CL')}</span></div>`;
  }
  if (currentProduct['Stock'] !== undefined && currentProduct['Stock'] !== '' && currentProduct['Stock'] !== 'null') {
    const stock = Number(currentProduct['Stock']);
    const stockColor = stock > 0 ? '#3E7A4D' : '#B94A3D';
    const stockText = stock > 0 ? `${stock} disponibles` : 'Sin stock';
    specsHtml += `<div class="spec-row"><span class="spec-label">Stock</span><span class="spec-val" style="color:${stockColor};">${stockText}</span></div>`;
  }
  document.getElementById('specsContainer').innerHTML = specsHtml;

  const fotos = ['Foto1','Foto2','Foto3','Foto4'].filter(k => currentProduct[k] && currentProduct[k] !== 'null');
  const grid = document.getElementById('photosGrid');
  if (fotos.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;padding:1rem;text-align:center;color:#B7BBC0;font-size:13px;">Sin fotos cargadas</div>';
  } else {
    grid.innerHTML = fotos.map((k, i) => `
      <div class="photo-item" id="photo-${i}" onclick="togglePhoto(${i}, '${currentProduct[k]}')">
        <img src="${currentProduct[k]}" onerror="this.parentElement.style.display='none'" />
        <div class="photo-check">✓</div>
      </div>`).join('');
  }
  updateWspBtn();
}

function togglePhoto(idx, url) {
  const el = document.getElementById(`photo-${idx}`);
  const i = selectedPhotos.indexOf(url);
  if (i === -1) { selectedPhotos.push(url); el.classList.add('selected'); }
  else { selectedPhotos.splice(i, 1); el.classList.remove('selected'); }
  updateWspBtn();
}

function updateWspBtn() {
  const btn = document.getElementById('wspBtn');
  const hint = document.getElementById('selectHint');
  if (selectedPhotos.length === 0) {
    btn.disabled = true;
    hint.textContent = 'Selecciona las fotos que quieres enviar';
  } else {
    btn.disabled = false;
    hint.textContent = `${selectedPhotos.length} foto(s) seleccionada(s)`;
  }
}

function copyText() {
  const p = currentProduct;
  const text = `*${p['Producto'] || ''} ${p['Item'] || ''}*\nCódigo: ${p['Codigo'] || ''}\nMarca: ${p['Marca'] || ''}\nModelo: ${p['Modelo'] || ''}\nRanuras Polea: ${p['Ranuras Polea'] || ''}\nVoltaje: ${p['Voltaje'] || ''}\nRefrigerante: ${p['Refrigerante'] || ''}`;
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2500);
  });
}

async function shareEverything() {
  const p = currentProduct;
  const btn = document.getElementById('wspBtn');
  const text = `*${p['Producto'] || ''} ${p['Item'] || ''}*\nCódigo: ${p['Codigo'] || ''}\nMarca: ${p['Marca'] || ''}\nModelo: ${p['Modelo'] || ''}\nVoltaje: ${p['Voltaje'] || ''}\nRefrigerante: ${p['Refrigerante'] || ''}`;

  try {
    btn.textContent = '⏳ Procesando...';
    btn.disabled = true;

    await navigator.clipboard.writeText(text);

    const filePromises = selectedPhotos.map(async (url, i) => {
      const finalUrl = `https://images.weserv.nl/?url=${encodeURIComponent(url)}&output=jpg&q=70`;
      const res = await fetch(finalUrl);
      const blob = await res.blob();
      return new File([blob], `producto_${i+1}.jpg`, { type: 'image/jpeg' });
    });

    const files = await Promise.all(filePromises);

    if (navigator.share && navigator.canShare({ files })) {
      await navigator.share({ files, text, title: p['Producto'] });
      const msg = document.getElementById('copiedMsg');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 3000);
    } else {
      throw new Error("No compatible");
    }
  } catch(e) {
    const links = `\n\nFotos:\n${selectedPhotos.join('\n')}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text + links)}`, '_blank');
  } finally {
    btn.textContent = '💬 Enviar por WhatsApp';
    btn.disabled = false;
  }
}

function goBack() {
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('detailView').classList.remove('active');
  currentProduct = null;
  selectedPhotos = [];
}

loadProducts();

// Registro del service worker: habilita que el navegador ofrezca
// "Instalar app" / "Agregar a pantalla de inicio".
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
