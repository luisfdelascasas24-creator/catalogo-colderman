<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Colderman</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <header class="text-center my-6">
            <h1 class="text-3xl font-bold text-cyan-400">Catálogo Colderman</h1>
            <p class="text-slate-400 text-sm">Consulta rápida de stock, costos y modelos</p>
        </header>

        <!-- Buscador -->
        <div class="mb-6">
            <input type="text" id="buscador" placeholder="Busca por código o nombre (ej: HILUX, CMP-0151)..." 
                class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400 text-lg shadow-inner">
        </div>

        <!-- Contenedor de Resultados -->
        <div id="resultado" class="space-y-4">
            <p class="text-center text-slate-500">Cargando catálogo...</p>
        </div>
    </div>

    <script>
        let productos = [];

        async function cargarDatos() {
            try {
                const respuesta = await fetch('productos.json');
                productos = await respuesta.json();
                mostrarProductos(productos);
            } catch (error) {
                document.getElementById('resultado').innerHTML = '<p class="text-red-400 text-center">Error al cargar el catálogo.</p>';
            }
        }

        function mostrarProductos(lista) {
            const contenedor = document.getElementById('resultado');
            if (lista.length === 0) {
                contenedor.innerHTML = '<p class="text-center text-slate-400">No se encontraron productos.</p>';
                return;
            }

            contenedor.innerHTML = lista.map(p => `
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col md:flex-row gap-4 items-center shadow-lg">
                    <img src="${p.fotos[0] || 'https://via.placeholder.com/150'}" alt="${p.nombre}" class="w-28 h-28 object-contain bg-white rounded-lg p-1">
                    <div class="flex-1 w-full text-left">
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-semibold bg-cyan-900 text-cyan-300 px-2 py-1 rounded">${p.codigo}</span>
                            <span class="text-sm font-bold ${p.stock > 0 ? 'text-emerald-400' : 'text-rose-400'}">Stock: ${p.stock}</span>
                        </div>
                        <h2 class="text-lg font-bold text-white mt-1">${p.nombre}</h2>
                        <p class="text-sm text-slate-400">Modelo: ${p.modelo || 'N/A'} | Voltaje: ${p.voltaje || 'N/A'}</p>
                        <p class="text-cyan-400 font-semibold mt-2">Costo: $${p.costo.toLocaleString('es-CL')}</p>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('buscador').addEventListener('input', (e) => {
            const texto = e.target.value.toLowerCase();
            const filtrados = productos.filter(p => 
                p.codigo.toLowerCase().includes(texto) || 
                p.nombre.toLowerCase().includes(texto) ||
                (p.modelo && p.modelo.toLowerCase().includes(texto))
            );
            mostrarProductos(filtrados);
        });

        cargarDatos();
    </script>
</body>
</html>
